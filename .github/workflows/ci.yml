name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: uv.lock
      - name: Cache uv downloads by lock
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1, Node 24
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}
      - name: Install locked environment
        run: |
          python -m pip install uv==0.13.8
          uv sync --locked --extra dev --extra ml
      - name: Offline tests with real synthetic backend
        run: uv run --no-sync python -m pytest --cov=poem_generator --cov-report=term-missing
      - name: Lint
        run: uv run --no-sync python -m ruff check src tests scripts
      - name: Format
        run: uv run --no-sync python -m ruff format --check src tests scripts
      - name: Types
        run: uv run --no-sync python -m mypy src
      - name: Pre-commit
        run: uv run --no-sync python -m pre_commit run --all-files
      - name: Activate locked environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: CLI
        run: |
          python -m poem_generator --help
          python main.py --help
          poem-generator --help
      - name: Build data-only container
        run: docker build --tag poem-generator:ci .
      - name: Container smoke checks
        run: |
          docker run --rm poem-generator:ci --help
          printf 'moon shines bright\nstars glow softly\n' > /tmp/poem-demo.txt
          docker run --rm -v /tmp/poem-demo.txt:/data.txt:ro poem-generator:ci check-data --data /data.txt
      - name: Standalone synthetic demo
        run: uv run --no-sync python scripts/demo.py /tmp/standalone-synthetic-demo
      - name: Opt-in locked CPU ML container
        run: |
          docker build -f Dockerfile.ml --tag synthetic-ml:ci .
          docker run --rm --network none synthetic-ml:ci
