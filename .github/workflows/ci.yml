name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install development and CPU ML package
        run: python -m pip install -e '.[dev,ml]'
      - name: Offline tests with real synthetic backend
        run: python -m pytest --cov=poem_generator --cov-report=term-missing
      - name: Lint
        run: python -m ruff check src tests
      - name: Format
        run: python -m ruff format --check src tests
      - name: Types
        run: python -m mypy src
      - name: Pre-commit
        run: python -m pre_commit run --all-files
      - name: CLI
        run: |
          python -m poem_generator --help
          python main.py --help
          poem-generator --help
      - name: Build data-only container
        run: docker build --tag poem-generator:ci .
      - name: Container smoke checks
        run: |
          docker run --rm poem-generator:ci --help
          printf 'moon shines bright\nstars glow softly\n' > /tmp/poem-demo.txt
          docker run --rm -v /tmp/poem-demo.txt:/data.txt:ro poem-generator:ci check-data --data /data.txt
